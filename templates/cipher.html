{% extends "base.html" %}
{% block title %}{{ meta.name }} — CipherLab{% endblock %}

{% block content %}
<div data-cipher="{{ cipher }}" data-uses-iv="{{ 'true' if meta.uses_iv else 'false' }}" id="app">

  <!-- 헤더 -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold tracking-tight text-slate-50">
      <span class="font-mono text-neon glow-text">{{ meta.name }}</span>
      <span class="text-slate-500 text-lg font-normal">{{ meta.full_name }}</span>
    </h1>
    <p class="mt-2 text-sm text-slate-400">{{ meta.description }}</p>
  </div>

  <!-- 모드 토글 + 경고/에러 표시 (같은 행 오른쪽) -->
  <div class="flex items-center justify-between gap-3 mb-6">
    <div class="inline-flex p-1 rounded-xl border border-edge bg-panel/70 shrink-0">
      <button data-mode="message" class="mode-tab tab-active px-5 py-2 rounded-lg text-sm font-medium transition-all">메시지</button>
      <button data-mode="file" class="mode-tab px-5 py-2 rounded-lg text-sm font-medium transition-all">파일</button>
    </div>
    <div id="error" class="hidden px-3 py-2 rounded-lg border border-red-500/30 bg-red-500/10 text-xs text-red-300 text-right max-w-md"></div>
  </div>

  <!-- 키 / IV -->
  <div class="grid sm:grid-cols-2 gap-4 mb-6">
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1.5">키 (패스프레이즈)</label>
      <input id="keytext" type="text" value="samsjang" autocomplete="off" spellcheck="false"
             class="field font-mono" placeholder="예: samsjang" />
    </div>
    <div id="iv-wrap" class="{{ '' if meta.uses_iv else 'hidden' }}">
      <label class="block text-xs font-medium text-slate-400 mb-1.5">IV (초기화 벡터 텍스트)</label>
      <input id="ivtext" type="text" value="1234" autocomplete="off" spellcheck="false"
             class="field font-mono" placeholder="예: 1234" />
    </div>
  </div>

  <!-- ===== 메시지 모드 ===== -->
  <section id="panel-message">
    <div class="flex items-center justify-between mb-2">
      <label class="text-xs font-medium text-slate-400">평문</label>
      <div class="flex items-center gap-2 text-xs">
        <span class="text-slate-500">암호문 인코딩</span>
        <div class="inline-flex p-0.5 rounded-lg border border-edge bg-panel">
          <button data-enc="base64" class="enc-tab enc-active px-2.5 py-1 rounded-md font-mono transition-all">base64</button>
          <button data-enc="hex" class="enc-tab px-2.5 py-1 rounded-md font-mono transition-all">hex</button>
        </div>
      </div>
    </div>
    <textarea id="plaintext" rows="5" spellcheck="false"
              class="field font-mono resize-y" placeholder="암호화할 메시지를 입력하세요...">python3x</textarea>

    <div class="flex flex-wrap gap-3 my-4">
      <button id="btn-encrypt" class="btn-primary">암호화 ↓</button>
      <button id="btn-decrypt" class="btn-ghost">복호화 ↑</button>
    </div>

    <div class="flex items-center justify-between mb-2">
      <label class="text-xs font-medium text-slate-400">암호문 (<span class="enc-label font-mono text-neon">base64</span>)</label>
      <button id="btn-copy" class="text-xs text-slate-500 hover:text-neon transition-colors">복사</button>
    </div>
    <textarea id="ciphertext" rows="5" spellcheck="false"
              class="field font-mono resize-y text-neon-soft" placeholder="암호문이 여기에 표시됩니다..."></textarea>
  </section>

  <!-- ===== 파일 모드 ===== -->
  <section id="panel-file" class="hidden">
    <div id="dropzone"
         class="dropzone rounded-2xl border-2 border-dashed border-edge bg-panel/40 p-10 text-center cursor-pointer transition-all">
      <input id="file-input" type="file" class="hidden" />
      <div class="text-slate-500 text-sm">
        <div class="text-3xl mb-2">⬆</div>
        <span id="file-label">파일을 드래그하거나 클릭해 선택</span>
      </div>
    </div>
    <div class="flex flex-wrap gap-3 mt-5">
      <button id="btn-file-encrypt" class="btn-primary">암호화 → .enc 다운로드</button>
      <button id="btn-file-decrypt" class="btn-ghost">복호화 → 원본 다운로드</button>
    </div>
    <p class="mt-3 text-xs text-slate-600">
      암호화하면 <span class="font-mono text-slate-400">이름.enc</span>, 복호화하면 원본 파일을 내려받습니다. (최대 25MB)
    </p>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
